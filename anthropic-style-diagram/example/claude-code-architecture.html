<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Claude Code — architecture</title>
  <style>
    :root {
      --p: #1f1f1d;
      --s: #5f5e5a;
      --t: #5f5e5a;
      --bg2: #f8f7f2;
      --b: #c8c6bc;
    }
    html, body { margin: 0; padding: 0; background: #f3f2ee; }
    body { font-family: "Anthropic Sans", system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .page { max-width: 980px; margin: 24px auto; padding: 0 16px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .t  { font-size: 14px; fill: var(--p); stroke: none; stroke-width: 0; }
    .ts { font-size: 12px; fill: var(--s); stroke: none; stroke-width: 0; }
    .th { font-size: 14px; fill: var(--p); font-weight: 600; stroke: none; stroke-width: 0; }
    text { stroke: none; stroke-width: 0; }
    .box > rect, rect.box { fill: var(--bg2); stroke: var(--b); stroke-width: 0.5; }
    .arr { stroke: var(--s); fill: none; stroke-width: 1.5; }
    .node { cursor: default; }
    .c-purple > rect, .c-purple rect { fill: #eeedfe; stroke: #7f77dd; stroke-width: 0.5; }
    .c-purple .th, .c-purple .t { fill: #3c3489; }
    .c-purple .ts { fill: #534ab7; }
    .c-teal > rect, .c-teal rect { fill: #e1f5ee; stroke: #1d9e75; stroke-width: 0.5; }
    .c-teal .th, .c-teal .t { fill: #085041; }
    .c-teal .ts { fill: #0f6e56; }
    .c-amber > rect, .c-amber rect { fill: #faeeda; stroke: #ba7517; stroke-width: 0.5; }
    .c-amber .th, .c-amber .t { fill: #633806; }
    .c-amber .ts { fill: #854f0b; }
    .c-blue > rect, .c-blue rect { fill: #e6f1fb; stroke: #378add; stroke-width: 0.5; }
    .c-blue .th, .c-blue .t { fill: #0c447c; }
    .c-blue .ts { fill: #185fa5; }
    .c-coral > rect, .c-coral rect { fill: #faece7; stroke: #d85a30; stroke-width: 0.5; }
    .c-coral .th, .c-coral .t { fill: #712b13; }
    .c-coral .ts { fill: #993c1d; }
    .c-green > rect, .c-green rect { fill: #eaf3de; stroke: #639922; stroke-width: 0.5; }
    .c-green .th, .c-green .t { fill: #27500a; }
    .c-green .ts { fill: #3b6d11; }
    .c-gray > rect, .c-gray rect { fill: #f1efe8; stroke: #888780; stroke-width: 0.5; }
    .c-gray .th, .c-gray .t { fill: #444441; }
    .c-gray .ts { fill: #5f5e5a; }
    @media (prefers-color-scheme: dark) {
      :root { --p: #f2f2ef; --s: #d3d1c7; --t: #b4b2a9; --bg2: #2c2c2a; --b: #888780; }
      html, body { background: #1f1f1d; }
      .c-purple > rect, .c-purple rect { fill: #3c3489; stroke: #afa9ec; }
      .c-purple .th, .c-purple .t { fill: #cecbf6; }
      .c-purple .ts { fill: #afa9ec; }
      .c-teal > rect, .c-teal rect { fill: #085041; stroke: #5dcaa5; }
      .c-teal .th, .c-teal .t { fill: #9fe1cb; }
      .c-teal .ts { fill: #5dcaa5; }
      .c-amber > rect, .c-amber rect { fill: #633806; stroke: #ef9f27; }
      .c-amber .th, .c-amber .t { fill: #fac775; }
      .c-amber .ts { fill: #ef9f27; }
      .c-blue > rect, .c-blue rect { fill: #0c447c; stroke: #85b7eb; }
      .c-blue .th, .c-blue .t { fill: #b5d4f4; }
      .c-blue .ts { fill: #85b7eb; }
      .c-coral > rect, .c-coral rect { fill: #712b13; stroke: #f0997b; }
      .c-coral .th, .c-coral .t { fill: #f5c4b3; }
      .c-coral .ts { fill: #f0997b; }
      .c-green > rect, .c-green rect { fill: #27500a; stroke: #97c459; }
      .c-green .th, .c-green .t { fill: #c0dd97; }
      .c-green .ts { fill: #97c459; }
      .c-gray > rect, .c-gray rect { fill: #444441; stroke: #b4b2a9; }
      .c-gray .th, .c-gray .t { fill: #d3d1c7; }
      .c-gray .ts { fill: #b4b2a9; }
    }
  </style>
</head>
<body>
  <div class="page">
    <svg width="100%" viewBox="0 0 680 590" role="img">
      <title>Claude Code architecture diagram</title>
      <desc>Architecture of Claude Code: terminal REPL feeds a core session engine (session manager, context compression, permission system), which communicates bidirectionally with the Anthropic API. Tool calls route through built-in tools and MCP servers. The Agent tool spawns sub-agents from a pool; hooks and config govern behavior.</desc>

      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </marker>
      </defs>

      <!-- ===== ROW 1: Terminal / REPL ===== -->
      <g class="node c-purple">
        <rect x="230" y="30" width="220" height="56" rx="8" stroke-width="0.5"/>
        <text class="th" x="340" y="52" text-anchor="middle" dominant-baseline="central">Terminal / REPL</text>
        <text class="ts" x="340" y="70" text-anchor="middle" dominant-baseline="central">Interactive command loop</text>
      </g>

      <!-- Arrow: Terminal → Core -->
      <line x1="340" y1="86" x2="340" y2="108" class="arr" marker-end="url(#arrow)"/>

      <!-- ===== ROW 2: Core Session Engine ===== -->
      <g class="c-teal">
        <rect x="40" y="108" width="600" height="130" rx="12" stroke-width="0.5"/>
        <text class="th" x="340" y="126" text-anchor="middle" dominant-baseline="central">Claude Code core engine</text>
      </g>

      <g class="node box">
        <rect x="58" y="142" width="160" height="64" rx="8" stroke-width="0.5"/>
        <text class="th" x="138" y="164" text-anchor="middle" dominant-baseline="central">Session manager</text>
        <text class="ts" x="138" y="183" text-anchor="middle" dominant-baseline="central">History · CLAUDE.md</text>
      </g>

      <g class="node box">
        <rect x="240" y="142" width="170" height="64" rx="8" stroke-width="0.5"/>
        <text class="th" x="325" y="164" text-anchor="middle" dominant-baseline="central">Context compression</text>
        <text class="ts" x="325" y="183" text-anchor="middle" dominant-baseline="central">Auto-squish near limit</text>
      </g>

      <g class="node box">
        <rect x="432" y="142" width="188" height="64" rx="8" stroke-width="0.5"/>
        <text class="th" x="526" y="164" text-anchor="middle" dominant-baseline="central">Permission system</text>
        <text class="ts" x="526" y="183" text-anchor="middle" dominant-baseline="central">Approve · Deny · Auto</text>
      </g>

      <!-- Arrows Core → API (send) and API → Core (receive, dashed) -->
      <line x1="190" y1="238" x2="190" y2="262" class="arr" marker-end="url(#arrow)"/>
      <line x1="490" y1="262" x2="490" y2="238" class="arr" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

      <!-- ===== ROW 3: Anthropic API ===== -->
      <g class="node c-purple">
        <rect x="40" y="262" width="600" height="60" rx="8" stroke-width="0.5"/>
        <text class="th" x="340" y="282" text-anchor="middle" dominant-baseline="central">Anthropic API</text>
        <text class="ts" x="340" y="300" text-anchor="middle" dominant-baseline="central">Claude Opus 4.6 · Sonnet 4.6 · Haiku 4.5</text>
      </g>

      <!-- Arrows API → Tools -->
      <line x1="190" y1="322" x2="190" y2="346" class="arr" marker-end="url(#arrow)"/>
      <line x1="490" y1="322" x2="490" y2="346" class="arr" marker-end="url(#arrow)"/>

      <!-- ===== ROW 4: Built-in Tools | MCP Servers ===== -->
      <g class="node c-green">
        <rect x="40" y="346" width="280" height="110" rx="8" stroke-width="0.5"/>
        <text class="th" x="180" y="370" text-anchor="middle" dominant-baseline="central">Built-in tools</text>
        <text class="ts" x="180" y="390" text-anchor="middle" dominant-baseline="central">Bash · Grep · Glob</text>
        <text class="ts" x="180" y="408" text-anchor="middle" dominant-baseline="central">Read · Write · Edit</text>
        <text class="ts" x="180" y="426" text-anchor="middle" dominant-baseline="central">Agent · TodoWrite · WebFetch</text>
      </g>

      <g class="node c-amber">
        <rect x="360" y="346" width="280" height="110" rx="8" stroke-width="0.5"/>
        <text class="th" x="500" y="370" text-anchor="middle" dominant-baseline="central">MCP servers</text>
        <text class="ts" x="500" y="390" text-anchor="middle" dominant-baseline="central">chrome-devtools · ide</text>
        <text class="ts" x="500" y="408" text-anchor="middle" dominant-baseline="central">context7</text>
        <text class="ts" x="500" y="426" text-anchor="middle" dominant-baseline="central">User-defined servers</text>
      </g>

      <!-- Arrow: Agent tool → Sub-agents -->
      <line x1="180" y1="456" x2="180" y2="480" class="arr" marker-end="url(#arrow)"/>

      <!-- ===== ROW 5: Sub-agent Pool | Hooks & Config ===== -->
      <g class="node c-coral">
        <rect x="40" y="480" width="280" height="80" rx="8" stroke-width="0.5"/>
        <text class="th" x="180" y="504" text-anchor="middle" dominant-baseline="central">Sub-agent pool</text>
        <text class="ts" x="180" y="522" text-anchor="middle" dominant-baseline="central">Spawned by Agent tool</text>
        <text class="ts" x="180" y="540" text-anchor="middle" dominant-baseline="central">Independent Claude processes</text>
      </g>

      <g class="node c-gray">
        <rect x="360" y="480" width="280" height="80" rx="8" stroke-width="0.5"/>
        <text class="th" x="500" y="504" text-anchor="middle" dominant-baseline="central">Hooks &amp; config</text>
        <text class="ts" x="500" y="522" text-anchor="middle" dominant-baseline="central">settings.json · .claude/</text>
        <text class="ts" x="500" y="540" text-anchor="middle" dominant-baseline="central">CLAUDE.md rules</text>
      </g>

      <!-- Feedback loop: right side, config/hooks back up to core engine -->
      <path d="M 640 520 L 660 520 L 660 173 L 640 173" fill="none" stroke="var(--s)" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
      <text class="ts" x="663" y="347" text-anchor="start" dominant-baseline="central">&#x21BB;</text>

    </svg>
  </div>
</body>
</html>
